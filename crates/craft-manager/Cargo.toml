[package]
name = "craft-manager"
description = "Verified, per-user installation and updates for the Craft apps"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/treeforjs/craftworks"

[lib]
path = "src/lib.rs"

[dependencies]
craft-update = { path = "../craft-update", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
base64 = "0.22"
ed25519-dalek = "3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
craft-update = { path = "../craft-update", features = ["github"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
dbg_macro = "warn"
