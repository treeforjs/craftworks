[package]
name = "craft-update"
description = "In-app updates for the craft apps: check GitHub Releases, download, verify a signed checksum list, install and restart"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/treeforjs/craftworks"
readme = "README.md"
include = ["src/**", "tests/**", "README.md", "Cargo.toml"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
ed25519-dalek = "3"
base64 = "0.22"

# The network and the installers exist only on the desktop; the web build gets version,
# release and verification logic (and keeps opening the releases page).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = "3"
rustls-native-certs = "0.8"

[dev-dependencies]
tempfile = "3"
base64 = "0.22"
sha2 = "0.11"
ed25519-dalek = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
dbg_macro = "warn"
