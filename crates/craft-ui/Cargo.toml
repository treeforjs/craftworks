[package]
name = "craft-ui"
description = "The shared design system of the craft apps: tokens, theme and components for egui"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/treeforjs/craftworks"
readme = "README.md"
include = ["src/**", "examples/**", "README.md", "Cargo.toml"]

[dependencies]
egui = { version = "0.36", default-features = false }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
egui = { version = "0.36", default-features = false, features = ["default_fonts"] }
# Headless screenshots in examples/gallery.rs.
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
dbg_macro = "warn"
