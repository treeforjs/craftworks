name: Craftworks release

on:
  push:
    branches: [release]
    tags: ["craftworks-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: craftworks-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CRAFT_UPDATE_PUBLIC_KEY: ${{ vars.CRAFT_UPDATE_PUBLIC_KEY }}
  CRAFTWORKS_UPDATE_PUBLIC_KEY: ${{ vars.CRAFTWORKS_UPDATE_PUBLIC_KEY }}
  PDFCRAFT_UPDATE_PUBLIC_KEY: ${{ vars.PDFCRAFT_UPDATE_PUBLIC_KEY }}
  VECTORCRAFT_UPDATE_PUBLIC_KEY: ${{ vars.VECTORCRAFT_UPDATE_PUBLIC_KEY }}
  PHOTOCRAFT_UPDATE_PUBLIC_KEY: ${{ vars.PHOTOCRAFT_UPDATE_PUBLIC_KEY }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Validate version and trusted app keys
        run: |
          version="$(python3 packaging/version.py)"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "craftworks-v$version" ]]; then
            echo "::error::The tag must match the Craftworks Cargo.toml version."
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          python3 - <<'PY'
          import base64, os
          for app in ("PDFCRAFT", "VECTORCRAFT", "PHOTOCRAFT", "CRAFTWORKS"):
              name = f"{app}_UPDATE_PUBLIC_KEY"
              text = os.environ.get(name) or os.environ.get("CRAFT_UPDATE_PUBLIC_KEY", "")
              try:
                  key = base64.b64decode(text.strip(), validate=True)
                  valid = len(key) == 32 or (len(key) == 44 and key.startswith(bytes.fromhex("302a300506032b6570032100")))
              except ValueError:
                  valid = False
              if not valid:
                  raise SystemExit(f"::error::Set repository variable {name}, or the shared CRAFT_UPDATE_PUBLIC_KEY, to a base64 Ed25519 public key. See docs/launcher.md.")
          PY

  signing:
    if: github.ref == 'refs/heads/release' || startsWith(github.ref, 'refs/tags/craftworks-v')
    needs: prepare
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - name: Validate the private and public signing keys
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: python3 packaging/signing/check-key.py

  windows:
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.signing.result == 'success' || needs.signing.result == 'skipped') }}
    needs: [prepare, signing]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-latest, target: x86_64-pc-windows-msvc }
          - { arch: arm64, runner: windows-11-arm, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: craftworks-windows-${{ matrix.arch }}
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed.' }
      - name: Build the current-user installer and portable zip
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Arch ${{ matrix.arch }} -MakeNsis "${env:ProgramFiles(x86)}/NSIS/makensis.exe"
      - name: Verify complete signed app installations
        timeout-minutes: 10
        run: |
          cargo test --locked -p craft-update --test published_launcher -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Craftworks release discovery failed.' }
          cargo test --locked -p craft-manager --test published_installs -- --ignored --nocapture
      - name: Check the portable binary
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $archive = Get-Item dist/release/*-portable.zip
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath target/portable-smoke
          $binary = Get-ChildItem target/portable-smoke -Filter craftworks.exe -Recurse | Select-Object -First 1
          if (-not $binary) { throw 'Portable archive has no Craftworks binary.' }
          $stdout = Join-Path $env:RUNNER_TEMP 'craftworks-version.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'craftworks-version-error.txt'
          $process = Start-Process -FilePath $binary.FullName -ArgumentList '--version' -Wait -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if ($process.ExitCode -ne 0) { throw "Portable binary smoke check failed: $($process.ExitCode)." }
          $reported = (Get-Content -LiteralPath $stdout -Raw).Trim()
          if ($reported -ne "Craftworks $env:VERSION") { throw 'Portable binary reported an unexpected version.' }
          Write-Output $reported
      - uses: actions/upload-artifact@v4
        with:
          name: craftworks-windows-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  linux:
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.signing.result == 'success' || needs.signing.result == 'skipped') }}
    needs: [prepare, signing]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04 }
          - { arch: aarch64, runner: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev \
            libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev desktop-file-utils
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: craftworks-linux-${{ matrix.arch }}
      - name: Build and package
        run: bash packaging/linux/package.sh
      - name: Install Wayland window-check tools
        if: matrix.arch == 'x86_64'
        run: sudo apt-get install -y --no-install-recommends weston xvfb scrot libegl1-mesa libgl1-mesa-dri fonts-cantarell
      - name: Check the native Wayland window frame
        if: matrix.arch == 'x86_64'
        timeout-minutes: 3
        run: bash packaging/linux/check-window-frame.sh target/release/craftworks target/window-frame
      - uses: actions/upload-artifact@v4
        if: always() && matrix.arch == 'x86_64'
        with:
          name: window-frame-linux-x86_64
          path: target/window-frame/
          if-no-files-found: warn
      - name: Verify complete signed app installations
        timeout-minutes: 10
        run: |
          cargo test --locked -p craft-update --test published_launcher -- --ignored --nocapture
          cargo test --locked -p craft-manager --test published_installs -- --ignored --nocapture
      - name: Check user installation and removal
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          target/release/craftworks --version
          mkdir -p target/install-smoke
          tar -xzf "dist/release/craftworks-$VERSION-linux-${{ matrix.arch }}.tar.gz" -C target/install-smoke
          cmp THIRD-PARTY-NOTICES.txt "target/install-smoke/craftworks-$VERSION-linux-${{ matrix.arch }}/THIRD-PARTY-NOTICES.txt"
          export HOME="$RUNNER_TEMP/craftworks-user"
          export XDG_DATA_HOME="$HOME/.local/share"
          bash "target/install-smoke/craftworks-$VERSION-linux-${{ matrix.arch }}/install.sh"
          cmp THIRD-PARTY-NOTICES.txt "$XDG_DATA_HOME/craftworks-launcher/THIRD-PARTY-NOTICES.txt"
          desktop-file-validate "$XDG_DATA_HOME/applications/io.github.treeforjs.craftworks.desktop"
          "$HOME/.local/bin/craftworks" --version
          bash "$XDG_DATA_HOME/craftworks-launcher/uninstall.sh"
          test ! -e "$HOME/.local/bin/craftworks"
          setup="dist/release/craftworks-$VERSION-linux-${{ matrix.arch }}-setup.sh"
          bash "$setup" --dry-run
          test ! -e "$HOME/.local/bin/craftworks"
          bash "$setup"
          cmp THIRD-PARTY-NOTICES.txt "$XDG_DATA_HOME/craftworks-launcher/THIRD-PARTY-NOTICES.txt"
          desktop-file-validate "$XDG_DATA_HOME/applications/io.github.treeforjs.craftworks.desktop"
          "$HOME/.local/bin/craftworks" --version
          bash "$setup"
          find "$XDG_DATA_HOME/craftworks-launcher-backups" -path '*/launcher/craftworks' -type f -print -quit | grep -q .
          "$HOME/.local/bin/craftworks" --version
          bash "$XDG_DATA_HOME/craftworks-launcher/uninstall.sh"
          test ! -e "$HOME/.local/bin/craftworks"
      - uses: actions/upload-artifact@v4
        with:
          name: craftworks-linux-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  release:
    if: ${{ !cancelled() && needs.signing.result == 'success' && needs.windows.result == 'success' && needs.linux.result == 'success' }}
    needs: [prepare, signing, windows, linux]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: craftworks-*
          path: artifacts
          merge-multiple: true
      - name: Sign the release checksum list
        working-directory: artifacts
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [[ -z "$UPDATE_SIGNING_KEY" ]]; then
            echo "::error::Set the release environment secret UPDATE_SIGNING_KEY before publishing. See docs/launcher.md."
            exit 1
          fi
          key="$RUNNER_TEMP/craftworks-signing-key.pem"
          trap 'rm -f -- "$key"' EXIT
          umask 077
          printf '%s\n' "$UPDATE_SIGNING_KEY" >"$key"
          python3 - <<'PY'
          import os
          from pathlib import Path
          version = os.environ["VERSION"]
          expected = {
              f"craftworks-{version}-windows-{arch}-{suffix}"
              for arch in ("x64", "arm64")
              for suffix in ("setup.exe", "portable.zip")
          } | {
              f"craftworks-{version}-linux-{arch}{suffix}"
              for arch in ("x86_64", "aarch64")
              for suffix in (".tar.gz", "-setup.sh")
          }
          actual = {path.name for path in Path(".").iterdir() if path.is_file()}
          if actual != expected or any(Path(name).stat().st_size == 0 for name in expected):
              raise SystemExit("::error::Release artifacts are missing, empty or unexpected.")
          PY
          expected="${CRAFTWORKS_UPDATE_PUBLIC_KEY:-$CRAFT_UPDATE_PUBLIC_KEY}"
          actual="$(openssl pkey -in "$key" -pubout -outform DER | base64 -w0)"
          # The embedded key may be raw (32 bytes) or SubjectPublicKeyInfo (44 bytes).
          export EXPECTED_KEY="$expected" ACTUAL_KEY="$actual"
          python3 - <<'PY'
          import base64, os
          def raw(name):
              key = base64.b64decode(os.environ[name].strip(), validate=True)
              return key[-32:]
          if raw("EXPECTED_KEY") != raw("ACTUAL_KEY"):
              raise SystemExit("::error::UPDATE_SIGNING_KEY does not match the embedded Craftworks public key.")
          PY
          sha256sum -- * >SHA256SUMS.txt
          openssl pkeyutl -sign -inkey "$key" -rawin -in SHA256SUMS.txt | base64 -w0 >SHA256SUMS.txt.sig
          test -s SHA256SUMS.txt.sig
          base64 -d SHA256SUMS.txt.sig >"$RUNNER_TEMP/craftworks-signature.bin"
          openssl pkey -in "$key" -pubout -out "$RUNNER_TEMP/craftworks-public.pem"
          openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/craftworks-public.pem" -rawin \
            -in SHA256SUMS.txt -sigfile "$RUNNER_TEMP/craftworks-signature.bin"
      - name: Draft a release for review
        working-directory: artifacts
        run: |
          tag="craftworks-v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::A release already exists for $tag; create a new version instead of replacing published files."
            exit 1
          fi
          pre=()
          [[ "$VERSION" != *-* ]] || pre=(--prerelease)
          tag_args=(--verify-tag)
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            bash "$GITHUB_WORKSPACE/packaging/signing/check-version-tag.sh" "$tag" "$GITHUB_SHA"
            tag_args=(--target "$GITHUB_SHA")
          fi
          gh release create "$tag" "${tag_args[@]}" --draft --title "Craftworks $VERSION" \
            --notes "Windows and Linux installers for Craftworks $VERSION. Checksums and their Ed25519 signature are included." \
            "${pre[@]}" -- *
