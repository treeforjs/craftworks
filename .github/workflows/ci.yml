name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Wasm
        run: cargo check --target wasm32-unknown-unknown
      - name: Gallery screenshots (software Vulkan)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q mesa-vulkan-drivers
          cargo run -p craft-ui --example gallery -- target/gallery
      - uses: actions/upload-artifact@v4
        with:
          name: gallery
          path: target/gallery/*.png

  # The updater's Windows paths (the MSI hand-off) only compile and run on Windows.
  windows-update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy -p craft-update --all-targets -- -D warnings
      - name: Test
        run: cargo test -p craft-update

  launcher:
    name: Craftworks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libxkbcommon-dev libwayland-dev \
            libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy -p craftworks -p craft-manager --all-targets -- -D warnings
      - name: Test
        run: cargo test -p craftworks -p craft-manager
      - name: Build
        run: cargo build --locked -p craftworks
      - name: Version (no display server)
        run: cargo run --locked -p craftworks -- --version
      - name: Launcher screenshots (software Vulkan)
        if: runner.os == 'Linux'
        run: cargo run -p craftworks --example launcher_gallery -- target/launcher-gallery
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: launcher-gallery
          path: target/launcher-gallery/*.png
          if-no-files-found: error
