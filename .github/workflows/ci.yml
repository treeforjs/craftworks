name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Wasm
        run: cargo check --target wasm32-unknown-unknown
      - name: Gallery screenshots (software Vulkan)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q mesa-vulkan-drivers
          cargo run -p craft-ui --example gallery -- target/gallery
      - uses: actions/upload-artifact@v4
        with:
          name: gallery
          path: target/gallery/*.png

  # The updater's Windows paths (the MSI hand-off) only compile and run on Windows.
  windows-update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy -p craft-update --all-targets -- -D warnings
      - name: Test
        run: cargo test -p craft-update
